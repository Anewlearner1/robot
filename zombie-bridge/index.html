<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>屍潮斷橋</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Noto+Sans+TC:wght@500;900&display=swap">
<style>
/* Layout: full-bleed WebGL stage; HUD pinned to the safe-area edges; overlays are one centered card.
   One visual world (hazy steel-blue morning on a concrete bridge), so a single theme on purpose. */
:root {
  --fog: #8fa3b3;
  --ink: #10151b;
  --panel: rgba(16, 21, 27, .74);
  --paper: #f3f1ec;
  --muted: #b9c3cc;
  --hazard: #ffb020;
  --hazard-deep: #a86a00;
  --blood: #e2363b;
  --ally: #2f7bff;
  --holo: #54dcff;
  --display: 'Bungee', 'Noto Sans TC', system-ui, sans-serif;
  --body: 'Noto Sans TC', system-ui, -apple-system, 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; background: var(--fog); color: var(--paper);
  font-family: var(--body); -webkit-user-select: none; user-select: none;
  touch-action: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
}
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }

#hud { position: fixed; inset: 0; pointer-events: none; }
.hud-top {
  position: absolute; left: 0; right: 0; top: 0;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 0;
  display: grid; gap: 8px;
}
.row { display: flex; align-items: center; gap: 10px; }
.chip {
  background: var(--panel); border-radius: 999px; padding: 6px 12px;
  font-family: var(--display); font-size: 14px; letter-spacing: .04em; white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.chip b { color: var(--hazard); font-weight: 400; }
.track { flex: 1; min-width: 0; height: 10px; background: var(--panel); border-radius: 6px; overflow: hidden; }
.fill { height: 100%; width: 100%; background: linear-gradient(90deg, var(--hazard), #ffd76a); transform: scaleX(0); transform-origin: 0 50%; will-change: transform; }
#mute, #pause {
  pointer-events: auto; border: 0; width: 36px; height: 36px; border-radius: 50%; flex: none; padding: 0;
  background: var(--panel); color: var(--paper); font: 900 13px var(--body); cursor: pointer;
  display: grid; place-items: center;
}
#pause svg { width: 14px; height: 14px; fill: currentColor; }
#mute:focus-visible, #pause:focus-visible, .btn:focus-visible, .step:focus-visible { outline: 3px solid var(--holo); outline-offset: 3px; }
#bossbar { display: grid; gap: 4px; }
#bossbar .label { font-family: var(--display); font-size: 13px; letter-spacing: .08em; color: #ffd0d0; text-shadow: 0 1px 2px #000; }
#bossbar .track { height: 12px; flex: none; }
#bossbar .track { position: relative; }
#bossbar .fill { background: linear-gradient(90deg, #8f1218, var(--blood)); transform: none; position: relative; z-index: 1; }
#bossbar .ghost { position: absolute; inset: 0; background: #ffe3e3; transform-origin: 0 50%; will-change: transform; }

.hud-bottom {
  position: absolute; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  display: flex; justify-content: space-between; align-items: flex-end; gap: 12px;
}
.squad { display: grid; gap: 2px; }
.squad .k { font-size: 12px; letter-spacing: .12em; color: var(--muted); text-shadow: 0 1px 2px #000; }
.squad .v { display: inline-block; transform-origin: 0 100%; font-family: var(--display); font-size: 40px; line-height: 1; text-shadow: 0 2px 0 var(--ink), 0 0 12px rgba(47,123,255,.6); font-variant-numeric: tabular-nums; }
.weapon { text-align: right; display: grid; gap: 2px; }
.weapon .v { font-weight: 900; font-size: 20px; text-shadow: 0 2px 0 var(--ink); }
.weapon .k { font-size: 12px; letter-spacing: .12em; color: var(--muted); text-shadow: 0 1px 2px #000; }
#hint {
  position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 84px); transform: translateX(-50%);
  background: var(--panel); padding: 8px 14px; border-radius: 999px; font-size: 14px; white-space: nowrap;
  transition: opacity .6s;
}

#pops { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.pop {
  position: absolute; left: 0; top: 0; font-family: var(--display); font-size: 26px; white-space: nowrap;
  color: #fff; text-shadow: 0 2px 0 var(--ink), 0 0 10px rgba(0,0,0,.4); will-change: transform, opacity;
}
.pop.good { color: #9fd0ff; }
.pop.bad { color: #ff8a8a; }
.pop.gold { color: var(--hazard); font-family: var(--body); font-weight: 900; font-size: 22px; }
.pop.holo { color: var(--holo); font-family: var(--body); font-weight: 900; font-size: 24px; }

.overlay {
  position: fixed; inset: 0; display: grid; place-items: center;
  padding: calc(env(safe-area-inset-top, 0px) + 24px) 16px calc(env(safe-area-inset-bottom, 0px) + 24px);
  background: radial-gradient(120% 80% at 50% 40%, rgba(16,21,27,.25), rgba(16,21,27,.82));
}
.card { width: 100%; max-width: 360px; display: grid; gap: 18px; justify-items: center; text-align: center; }
.eyebrow { font-family: var(--display); font-size: 14px; letter-spacing: .14em; color: var(--hazard); }
h1 {
  margin: 0; font-family: var(--body); font-weight: 900; font-size: clamp(48px, 15vw, 72px); line-height: 1;
  letter-spacing: .04em; text-wrap: balance;
  text-shadow: 0 4px 0 var(--ink), 0 0 30px rgba(226,54,59,.45);
}
h2 { margin: 0; font-weight: 900; font-size: clamp(36px, 11vw, 52px); line-height: 1.05; text-shadow: 0 3px 0 var(--ink); text-wrap: balance; }
.lede { margin: 0; font-size: 16px; line-height: 1.6; color: var(--paper); max-width: 30ch; text-wrap: pretty; }
.rules { list-style: none; margin: 0; padding: 14px 16px; display: grid; gap: 10px; text-align: left; background: var(--panel); border-radius: 14px; width: 100%; box-sizing: border-box; }
.rules li { display: grid; grid-template-columns: 10px 1fr; gap: 10px; align-items: baseline; font-size: 14px; line-height: 1.5; color: var(--muted); }
.rules li::before { content: ''; width: 10px; height: 10px; border-radius: 2px; background: var(--c, var(--hazard)); transform: translateY(1px); }
.rules strong { color: var(--paper); font-weight: 900; }
.stats { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.stat { background: var(--panel); border-radius: 12px; padding: 10px 14px; min-width: 84px; display: grid; gap: 2px; }
.stat .v { font-family: var(--display); font-size: 24px; font-variant-numeric: tabular-nums; }
.stat .k { font-size: 12px; color: var(--muted); letter-spacing: .1em; }
.btn {
  pointer-events: auto; cursor: pointer; border: 0; border-radius: 14px; padding: 14px 40px;
  background: var(--hazard); color: var(--ink); font: 900 20px var(--body); letter-spacing: .1em;
  box-shadow: 0 6px 0 var(--hazard-deep), 0 12px 24px rgba(0,0,0,.35); transition: transform .08s, box-shadow .08s;
}
.btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--hazard-deep), 0 6px 12px rgba(0,0,0,.35); }
.best { font-size: 13px; color: var(--muted); letter-spacing: .08em; }
#loading { font-family: var(--display); letter-spacing: .1em; }
@media (prefers-reduced-motion: reduce) { .btn, #hint { transition: none; } }

/* ---- juice layers ---- */
#flash, #vignette { position: fixed; inset: 0; pointer-events: none; opacity: 0; }
#vignette { background: radial-gradient(ellipse at 50% 50%, rgba(226,54,59,0) 38%, rgba(226,54,59,.55) 78%, rgba(150,10,20,.9) 100%); }
#tips { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.tip { position: absolute; left: 0; top: 0; opacity: 0; transition: opacity .25s; will-change: transform, opacity; }
.tip.on { opacity: 1; }
.tip span {
  display: block; position: relative; transform: translateY(-14px); background: var(--hazard); color: var(--ink);
  font: 900 15px/1 var(--body); letter-spacing: .06em; padding: 8px 12px; border-radius: 10px; white-space: nowrap;
  box-shadow: 0 3px 0 var(--hazard-deep), 0 6px 14px rgba(0,0,0,.35); animation: tipbob 1s ease-in-out infinite;
}
.tip span::after { content: ''; position: absolute; left: 50%; top: 100%; margin-left: -7px; border: 7px solid transparent; border-top-color: var(--hazard); }
@keyframes tipbob { 50% { transform: translateY(-20px); } }
.tip.below span { transform: translateY(14px); animation-name: tipbob2; }
.tip.below span::after { top: auto; bottom: 100%; border-top-color: transparent; border-bottom-color: var(--hazard); }
@keyframes tipbob2 { 50% { transform: translateY(20px); } }

/* ---- HUD extras ---- */
.row .push { margin-left: auto; }
#hudSquad.up { text-shadow: 0 2px 0 var(--ink), 0 0 16px rgba(80,160,255,.95); }

/* ---- overlays: scroll instead of clip on short screens ---- */
.overlay { display: flex; overflow-y: auto; touch-action: pan-y; -webkit-overflow-scrolling: touch; }
.overlay > .card { margin: auto; }
#pauseOv { background: rgba(16, 21, 27, .8); z-index: 5; }
.btn.ghost { background: rgba(16,21,27,.55); color: var(--paper); box-shadow: inset 0 0 0 2px rgba(243,241,236,.55); padding: 11px 32px; font-size: 17px; }
.btn.ghost:active { transform: translateY(2px); }
.btn.wide { width: 100%; max-width: 260px; box-sizing: border-box; padding-left: 16px; padding-right: 16px; }
.btnstack { display: grid; gap: 12px; width: 100%; justify-items: center; }
.stagepick { display: flex; align-items: center; justify-content: center; gap: 14px; }
.step {
  pointer-events: auto; border: 0; width: 44px; height: 44px; border-radius: 50%; cursor: pointer;
  background: var(--panel); color: var(--hazard); display: grid; place-items: center; padding: 0;
}
.step svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
.step:active { transform: scale(.92); }
.step[hidden] { display: none !important; }
.stagepick .eyebrow { min-width: 9ch; }
.link { background: none; border: 0; color: var(--muted); font: 500 14px var(--body); letter-spacing: .1em; text-decoration: underline; text-underline-offset: 4px; padding: 10px 16px; cursor: pointer; }

/* short phones (iPhone SE 667) and landscape */
@media (max-height: 700px) {
  .overlay { padding-top: calc(env(safe-area-inset-top, 0px) + 12px); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); }
  .card { gap: 10px; }
  h1 { font-size: clamp(44px, 13vw, 56px); }
  h2 { font-size: clamp(32px, 9vw, 42px); }
  .lede { font-size: 15px; line-height: 1.45; }
  .rules { padding: 10px 14px; gap: 6px; }
  .rules li { font-size: 13px; line-height: 1.4; }
  .btn { padding: 12px 40px; font-size: 18px; }
  .step { width: 38px; height: 38px; }
}
@media (max-height: 520px) and (min-width: 560px) {
  .overlay > .card { max-width: 720px; display: grid; grid-template-columns: 1fr 1fr; text-align: left; justify-items: stretch; align-items: center; column-gap: 28px; row-gap: 8px; }
  .card > * { grid-column: 1; }
  .card > .rules { grid-column: 2; grid-row: 1 / span 5; }
  .card .btn, .card .best, .card .btnstack, .card .stagepick, .card .link { justify-self: start; }
}
@media (min-width: 900px) and (min-height: 600px) {
  .card { max-width: 400px; }
}
@media (prefers-reduced-motion: reduce) { .tip span { animation: none; } .tip { transition: none; } }
</style>
</head>
<body>
<div id="stage"></div>

<div id="hud" hidden>
  <div class="hud-top">
    <div class="row">
      <span class="chip">LV <b id="hudLevel">1</b></span>
      <div class="track" aria-label="前進進度"><div class="fill" id="hudProg"></div></div>
      <span class="chip"><span id="hudKills">0</span> 殺</span>
      <button id="pause" type="button" aria-label="暫停"><svg viewBox="0 0 14 14" aria-hidden="true"><rect x="2" y="1" width="3.6" height="12" rx="1"/><rect x="8.4" y="1" width="3.6" height="12" rx="1"/></svg></button>
      <button id="mute" type="button" aria-label="切換音效">音</button>
    </div>
    <div id="bossbar" hidden>
      <span class="label">巨屍 BOSS</span>
      <div class="track"><div class="ghost" id="bossGhost"></div><div class="fill" id="bossFill"></div></div>
    </div>
  </div>
  <div id="hint">按住左右拖曳移動 · 小隊自動開火</div>
  <div class="hud-bottom">
    <div class="squad"><span class="k">小隊</span><span class="v" id="hudSquad">×1</span></div>
    <div class="weapon"><span class="k">武器</span><span class="v" id="hudWeapon">手槍</span></div>
  </div>
</div>
<div id="pops"></div>
<div id="tips" aria-hidden="true"></div>
<div id="vignette"></div>
<div id="flash"></div>

<section class="overlay" id="menu">
  <div class="card">
    <div class="stagepick">
      <button class="step" id="stagePrev" type="button" aria-label="上一關" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <span class="eyebrow" id="menuLevel">STAGE 1</span>
      <button class="step" id="stageNext" type="button" aria-label="下一關" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <h1>屍潮斷橋</h1>
    <p class="lede">已經有很多人倒在這座橋上。你能帶著小隊衝到對岸嗎？</p>
    <ul class="rules">
      <li><span><strong>左右拖曳</strong>移動，小隊會自動朝前方開火。</span></li>
      <li style="--c: var(--ally)"><span><strong>射擊數字門</strong>讓數字變大，穿過去就能補兵。紅色負數會扣人。</span></li>
      <li style="--c: var(--holo)"><span><strong>打滿電池</strong>召喚機甲；<strong>撿起槍</strong>升級火力。</span></li>
      <li style="--c: var(--blood)"><span>在橋尾<strong>擊倒巨屍</strong>才算過關。</span></li>
    </ul>
    <button class="btn" id="btnStart" type="button">出發</button>
    <span class="best" id="bestLine"></span>
  </div>
</section>

<section class="overlay" id="over" hidden>
  <div class="card">
    <span class="eyebrow" id="overLevel">STAGE 1</span>
    <h2>全軍覆沒</h2>
    <p class="lede" id="overReason">屍潮把你們淹沒了。</p>
    <div class="stats">
      <div class="stat"><span class="v" id="overKills">0</span><span class="k">擊殺</span></div>
      <div class="stat"><span class="v" id="overDist">0%</span><span class="k">進度</span></div>
    </div>
    <div class="btnstack">
      <button class="btn" id="btnRetry" type="button">再試一次</button>
      <button class="link" id="btnMenu1" type="button">回主選單</button>
    </div>
  </div>
</section>

<section class="overlay" id="win" hidden>
  <div class="card">
    <span class="eyebrow" id="winLevel">STAGE 1 CLEAR</span>
    <h2>成功過橋</h2>
    <p class="lede">巨屍倒下了。下一座橋的屍潮更多、更硬。</p>
    <div class="stats">
      <div class="stat"><span class="v" id="winKills">0</span><span class="k">擊殺</span></div>
      <div class="stat"><span class="v" id="winSquad">0</span><span class="k">生還隊員</span></div>
    </div>
    <div class="btnstack">
      <button class="btn" id="btnNext" type="button">下一關</button>
      <button class="link" id="btnMenu2" type="button">回主選單</button>
    </div>
  </div>
</section>

<section class="overlay" id="pauseOv" hidden role="dialog" aria-modal="true" aria-label="暫停">
  <div class="card">
    <span class="eyebrow">PAUSED</span>
    <h2>已暫停</h2>
    <div class="btnstack">
      <button class="btn wide" id="btnResume" type="button">繼續</button>
      <button class="btn ghost wide" id="btnRestart" type="button">重新開始</button>
      <button class="btn ghost wide" id="btnMenu3" type="button">回主選單</button>
    </div>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const T = window.THREE;
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rr = (a, b) => a + (b - a) * Math.random();

if (!T) {
  $('#menu .lede').textContent = '3D 引擎載入失敗，請檢查網路後重新整理。';
  $('#btnStart').hidden = true;
  return;
}

// Seeded RNG so every attempt at the same stage gets the same bridge.
function mulberry(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let R = Math.random;
const rnd = (a, b) => a + (b - a) * R();
const rint = (a, b) => Math.floor(rnd(a, b + 1));

// ---------------------------------------------------------------- constants
const ROAD = 4;          // half width of the deck
const BULLET_SPEED = 42;
const MAXZ = 900, MAXB = 700, MAXP = 1400, MAXVIS = 40, SP = 0.62;
const STEP = 1 / 60, MAX_STEPS = 4;   // fixed simulation step and the catch-up cap per rendered frame

// Every balance number lives here (read at use time, so tests can override them through __zb.TUNE before prepare()).
const TUNE = {
  startSquad: 3,
  run: 4.6,                       // forward speed (units/s)
  // --- how the hordes grow. A horde's size/hp = base x stage factor x position factor.
  hordeGrow: 0.38,                // size +38 % at stage 2 ...
  hpPerStage: 0.4,                // ... ordinary zombies +0.4 hp (fractions are rolled per zombie) ...
  stagePow: 0.5,                  // ... and later stages grow by (stage-1)^stagePow steps (concave: stage 3 is not twice stage 2)
  rampPow: 2, ramp: 4.7, hpRamp: 5, bruteRamp: 3,   // along the bridge (position p = 0..1): size x (1 + ramp*p^rampPow), hp x (1 + hpRamp*p^rampPow), brute count likewise
  count: { open: 8, wall: 50, blob: 30, line: 20 },
  bruteBase: 2, brutePerStage: 1, bruteHp: 10, bruteHpPerStage: 4,
  // --- layout spacing (units of empty bridge)
  spawnAhead: 58,                 // a horde is released when the squad is this far from its start line
  openingGap: 24,                 // between the opening cluster and the first pattern event
  hordeGap: [5, 8],               // after a horde (plus the horde's depth)
  gateGap: 12, weaponGap: 10,     // after a gate pair / a weapon pickup
  // --- gates and the opening cluster
  openGatePf: 0.47,               // the opening red gate costs this fraction of the usual bullets per point
  gatePer: 2, gatePerStage: 1, gatePerSquad: 5.3, // bullets for +1 on a gate = (per + perStage*stage + perSquad*min(squad,40)) -> a gate is worth about +5 whatever the squad size
  battNeed: 36, battNeedPerStage: 10,
  shieldSecs: 4,
  maxSquad: 60, mulChance: 0.3,   // squad size cap; chance that a good gate (after the first few) is a x2 gate
  // --- mech
  splashR2: 3.4, splashDmg: 0.6,  // shells: blast radius squared and damage fraction
  mechDmg: 2.5, mechDmgPerStage: 1, mechCd: 0.62,
  // --- boss: hp = bossHp*stage + bossDpsSecs * (squad damage per second that can land on it)
  bossHp: 220, bossDpsSecs: 7, bossSpeed: 1.1, bossSpeedPerStage: 0.08,
  bossFocus: 0.5,                 // share of the squad that shoots the boss while minions are around
  bossMinions: 6, bossMinionsPerStage: 2, bossMinionEvery: 3.4,
};
// Weapon roster. Contract shared by logic and presentation:
// - logic owns the numbers and behaviour fields (rate … bossEff, lvMul, maxLv) and keeps `ui` (1–5 bars shown on pickups) honest;
// - presentation owns `color` and draws per `fx`: 'bullet' | 'pellet' | 'rail' | 'flame' | 'rocket';
// - G.weapon is an index into this array, G.weaponLv is 1..maxLv. Picking up the gun you already hold raises its level
//   (damage x lvMul per level); picking up a different gun swaps to it at Lv1.
// speed: units/s; range: bullet lifetime in s; pierce: extra zombies a shot passes through; splash: blast radius (0 = none);
// knock: push-back on hit; bossEff: share of nominal damage that lands on the boss (sizes its hp).
const WEAPONS = [
  { id: 'pistol',  name: '手槍',   desc: '基本配槍',         fx: 'bullet', color: 0xffe08a, rate: 4,   pellets: 1, spread: 0.04, dmg: 1,   speed: 42, range: 0.56, pierce: 0, splash: 0,   knock: 0,   bossEff: 1,    lvMul: 1.35, maxLv: 3, ui: { power: 1, rate: 2, range: 3 } },

// ---------------------------------------------------------------- event bus
// Contract between game logic (emits) and presentation (listens). Logic never reaches into FX/HUD directly
// for new effects; it emits one of these and presentation code subscribes with bus.on(name, fn).
// Events: shot{x,z,w,lv} soldierDied{x,z} zombieDied{x,z,big} gateHit{e} gatePass{e,diff}
//         weaponPickup{e,w,lv,upgrade} heroActivated{e} bossSpawn{} bossHit{} bossDied{x,z} soldierContact{} gameOver{reason,cause,kind,phase} win{}
// gameOver.cause is 'horde' | 'boss' | 'gate'; kind is the horde kind of the zombie that landed the last blow (or '').
// Payloads are fresh objects; handlers may keep them.
const bus = {
  map: {},
  on(name, fn) { (this.map[name] || (this.map[name] = [])).push(fn); },
  emit(name, data) { const l = this.map[name]; if (l) for (const fn of l) fn(data || {}); },
};

// Shared shader clock (seconds of game time; freezes while paused).
const CLOCK = { uTime: { value: 0 } };
// Walk cycle in the vertex shader: legs swing about the hip, arms bob. Per instance (aWalk = phase, amplitude, speed)
// so one InstancedMesh draw call animates the whole horde; non-instanced meshes (boss) use a fixed phase.
function walkify(mat, hip, freq) {
  mat.onBeforeCompile = sh => {
    sh.uniforms.uTime = CLOCK.uTime;
    sh.uniforms.uHip = { value: hip };
    sh.uniforms.uFreq = { value: freq };
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', `#include <common>
attribute float aAnim;
#ifdef USE_INSTANCING
attribute vec3 aWalk;
#endif
uniform float uTime; uniform float uHip; uniform float uFreq;`)
      .replace('#include <begin_vertex>', `#include <begin_vertex>
{
  #ifdef USE_INSTANCING
  vec3 wk = aWalk;
  #else
  vec3 wk = vec3(0.0, 1.0, 1.0);
  #endif
  float k = abs(aAnim);
  if (k > 0.5 && wk.y > 0.0) {
    float th = uTime * uFreq * wk.z + wk.x;
    float a; float py;
    if (k < 1.5) { a = sin(th) * 0.72 * sign(aAnim) * wk.y; py = uHip; }
    else { a = sin(th * 2.0 + 1.0) * 0.16 * wk.y; py = 1.36; }
    float c = cos(a); float sn = sin(a);
    float yy = transformed.y - py; float zz = transformed.z;
    transformed.y = py + yy * c - zz * sn;
    transformed.z = yy * sn + zz * c;
  }
}`);
  };
  mat.customProgramCacheKey = () => 'walk1';
  return mat;
}
// Hologram: horizontal scan lines, a bright sweep climbing the mech, and an occasional sideways glitch.
function holoify(mat) {
  mat.onBeforeCompile = sh => {
    sh.uniforms.uTime = CLOCK.uTime;
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nvarying float vHy;\nuniform float uTime;')
      .replace('#include <begin_vertex>', `#include <begin_vertex>
  transformed.x += step(0.985, sin(uTime * 3.1 + transformed.y * 2.3)) * 0.14 * sin(uTime * 41.0);
  vHy = (modelMatrix * vec4(transformed, 1.0)).y;`);
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', '#include <common>\nvarying float vHy;\nuniform float uTime;')
      .replace('#include <dithering_fragment>', `#include <dithering_fragment>
  float scan = 0.55 + 0.45 * step(0.5, fract(vHy * 9.0 - uTime * 1.3));
  float sweep = max(0.0, 1.0 - abs(fract(uTime * 0.5) * 3.8 - vHy) * 2.6);
  gl_FragColor.a = clamp(gl_FragColor.a * scan + sweep * 0.5, 0.0, 1.0);
  gl_FragColor.rgb += vec3(0.35, 0.8, 1.0) * sweep * 0.7;`);
  };
  mat.customProgramCacheKey = () => 'holo1';
}

const pl = new Float32Array(MAXP), pm = new Float32Array(MAXP), pr = new Float32Array(MAXP), pg = new Float32Array(MAXP), pb = new Float32Array(MAXP);
let np = 0;

let fxScale = 1;   // 1 normally, lowered by the adaptive-quality governor when even the lowest resolution is slow
function burst(x, y, z, n, col, speed, life) {
  // particle budget: thin out new bursts as the pool fills so a big volley can't starve the important ones
  n = Math.ceil(n * fxScale * (np > MAXP * 0.7 ? 0.35 : np > MAXP * 0.45 ? 0.6 : 1));
  for (let i = 0; i < n && np < MAXP; i++, np++) {
    px[np] = x; py[np] = y; pz[np] = z;
    const a = Math.random() * Math.PI * 2, u = Math.random();
    pvx[np] = Math.cos(a) * speed * u; pvz[np] = Math.sin(a) * speed * u; pvy[np] = rr(0.3, 1) * speed;
    pl[np] = pm[np] = life * rr(0.6, 1);
    pr[np] = col[0]; pg[np] = col[1]; pb[np] = col[2];
  }
}

function rrect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}

let levelGroup = null;

function buildLevel(n) {
  if (levelGroup) { scene.remove(levelGroup); disposeTree(levelGroup); }

// Static scenery in as few draw calls as possible. The skyline loop consumes R() in exactly the original order so a stage
// keeps the same layout of hordes and gates.
function buildScenery(len, mid) {
  const parts = [[ROAD * 2 + 0.4, 0.6, len, 0, -0.3, mid, 0x8a837c]];
  for (const s of [-1, 1]) {
    parts.push([0.35, 0.35, len, s * (ROAD + 0.08), 0.17, mid, 0xbab3a9],
               [0.12, 0.12, len, s * (ROAD + 0.15), 0.98, mid, 0x3a3e44],
               [0.12, 0.12, len, s * (ROAD + 0.15), 0.6, mid, 0x3a3e44],
               [0.9, 2.4, len, s * (ROAD - 0.4), -1.8, mid, 0x5b6068]);
  }
  levelGroup.add(new T.Mesh(boxes(parts), M.vc));
  const water = new T.Mesh(new T.PlaneGeometry(600, len + 200).rotateX(-Math.PI / 2), M.water);
  water.position.set(0, -22, mid);
  levelGroup.add(water);
  // railing posts + lane dashes
  const postCount = Math.floor(len / 2.2) * 2;
  const posts = new T.InstancedMesh(new T.BoxGeometry(0.14, 1.05, 0.14), M.post, postCount);
  for (let i = 0; i < postCount; i++) {
    dummy.position.set((i % 2 ? 1 : -1) * (ROAD + 0.15), 0.5, 30 - Math.floor(i / 2) * 2.2);
    dummy.rotation.set(0, 0, 0); dummy.scale.setScalar(1); dummy.updateMatrix();
    posts.setMatrixAt(i, dummy.matrix);
  }
  posts.frustumCulled = false;
  levelGroup.add(posts);
  const dashCount = Math.floor(len / 5);
  const dashes = new T.InstancedMesh(new T.BoxGeometry(0.14, 0.02, 2.2), M.dash, dashCount);
  for (let i = 0; i < dashCount; i++) {
    dummy.position.set(0, 0.01, 30 - i * 5); dummy.updateMatrix();
    dashes.setMatrixAt(i, dummy.matrix);
  }
  dashes.frustumCulled = false;
  levelGroup.add(dashes);
  // suspension towers: unit boxes scaled per instance
  const tw = [];
  for (let z = -40; z > -len + 30; z -= 62) {
    for (const s of [-1, 1]) tw.push([s * (ROAD + 1.4), 0, z, 1, 46, 1]);
    tw.push([0, 21, z, ROAD * 2 + 3.8, 0.9, 1], [0, -1.2, z, ROAD * 2 + 3.8, 0.9, 1]);
  }
  const towers = new T.InstancedMesh(new T.BoxGeometry(1, 1, 1), M.tower, tw.length);
  tw.forEach((t, i) => { dummy.position.set(t[0], t[1], t[2]); dummy.scale.set(t[3], t[4], t[5]); dummy.updateMatrix(); towers.setMatrixAt(i, dummy.matrix); });
  towers.frustumCulled = false;
  levelGroup.add(towers);
  // hazy skyline on both banks
  const city = [];
  for (let z = 20; z > -len - 40; z -= rnd(6, 11)) {
    for (const s of [-1, 1]) {
      if (R() < 0.35) continue;
      const w = rnd(5, 12), h = rnd(10, 46);
      const x = s * rnd(26, 70);
      city.push([x, -22 + h / 2, z, w, h, rnd(5, 12)]);
    }
  }
  const sky = new T.InstancedMesh(new T.BoxGeometry(1, 1, 1), M.city, city.length);
  city.forEach((c, i) => {
    dummy.position.set(c[0], c[1], c[2]); dummy.scale.set(c[3], c[4], c[5]); dummy.updateMatrix();
    sky.setMatrixAt(i, dummy.matrix);
    sky.setColorAt(i, tmpC.setScalar(0.82 + Math.random() * 0.3));
  });
  sky.frustumCulled = false;
  levelGroup.add(sky);
  dummy.scale.setScalar(1);
}

// p = how far along the bridge the horde stands (0..1): later hordes are bigger and tougher because the squad is, too.
function hordeSpec(kind, n, side, p) {
  p = Math.pow(p || 0, TUNE.rampPow);
  const sd = Math.pow(n - 1, TUNE.stagePow);      // stage steps: concave when stagePow < 1 (later stages grow more slowly)
  const f = (1 + sd * TUNE.hordeGrow) * (1 + TUNE.ramp * p);
  const hp = (1 + sd * TUNE.hpPerStage) * (1 + TUNE.hpRamp * p);
  const C = TUNE.count;
  switch (kind) {
    case 'wall':   return { kind, cx: side * 2.1, w: 3.4, d: 14, count: Math.round(C.wall * f), hp };
    case 'blob':   return { kind, cx: rnd(-1.6, 1.6), w: 3.6, d: 6, count: Math.round(C.blob * f), hp };
    case 'line':   return { kind, cx: 0, w: 7.4, d: 2.6, count: Math.round(C.line * f), hp };
    case 'brutes': return { kind, cx: 0, w: 6.4, d: 4, count: Math.round((TUNE.bruteBase + TUNE.brutePerStage * n) * (1 + TUNE.bruteRamp * p)), hp: Math.round((TUNE.bruteHp + n * TUNE.bruteHpPerStage) * (1 + TUNE.hpRamp * p)), big: true };
    default:       return { kind: 'open', cx: -1.8, w: 3.6, d: 6, count: Math.round(C.open * (1 + sd * TUNE.hordeGrow)), hp: 1 + sd * TUNE.hpPerStage };
  }
}

function makeEvents(n, L) {
  const E = G.events;
  let z = -24;
  // Opening that mirrors the ad: a horde, then a red gate beside a dormant mech with a rifle between them.
  E.push({ type: 'horde', z, spec: hordeSpec('open', n, -1) });
  z -= 18;
  const heroSide = R() < 0.5 ? -1 : 1;
  E.push(makeWeapon(z + 7, 0, 1));
  const redGate = makeGate(z, -heroSide, -rint(2, 3), 'add', n);
  redGate.pf = TUNE.openGatePf;
  E.push(redGate);
  E.push(makeHero(z + 0.5, heroSide, n));
  z -= TUNE.openingGap;

  const pattern = ['wall', 'gates', 'line', 'blob', 'weapon', 'gates', 'brutes', 'wall', 'gates', 'line', 'weapon', 'blob', 'gates', 'brutes'];
  let i = 0, tier = 2;
  while (z > -L + 12) {
    const t = pattern[i % pattern.length]; i++;
    if (t === 'gates') {
      const pid = E.length;
      const s = R() < 0.5 ? -1 : 1;
      const good = R() < TUNE.mulChance && i > 3
        ? makeGate(z, s, 2, 'mul', n)
        : makeGate(z, s, rint(1, 3) + Math.floor(n / 2), 'add', n);
      const bad = makeGate(z, -s, -rint(1, 3) - Math.floor(n / 3), 'add', n);
      good.pair = bad.pair = pid;
      E.push(good, bad);
      z -= TUNE.gateGap;
    } else if (t === 'weapon') {
      if (tier < WEAPONS.length) { E.push(makeWeapon(z, rnd(-2.2, 2.2), tier++)); z -= TUNE.weaponGap; }
    } else {
      const spec = hordeSpec(t, n, R() < 0.5 ? -1 : 1, Math.min(1, -z / L));
      E.push({ type: 'horde', z, spec });
      z -= spec.d + rnd(TUNE.hordeGap[0], TUNE.hordeGap[1]);
    }
  }
}

function makeGate(z, side, val, kind, n) {
  const p = canvasPlane(4.2, 2.625, 320, 200);   // panel body is 3.6 x 2.25; the rest of the canvas holds the glow
  const grp = new T.Group();
  grp.position.set(side * 1.95, 0, z);
  p.mesh.position.y = 1.55;
  p.mesh.rotation.x = -0.42;
  grp.add(p.mesh);
  p.baseMat = new T.MeshBasicMaterial({ vertexColors: true });
  p.baseMat.userData.own = true;
  grp.add(new T.Mesh(GATEBASE, p.baseMat));
  levelGroup.add(grp);
  const e = { type: 'gate', z, x: side * 1.95, side, val, kind, per: TUNE.gatePer + TUNE.gatePerStage * n, pf: 1, hits: 0, used: false, bump: 0, fade: 0, grp, p };
  e.draw = () => drawGate(e);
  e.draw();
  return e;
}
function drawGate(e) {
  const { ctx: c, cw: W, ch: H } = e.p;
  const pos = e.kind === 'mul' || e.val > 0;
  const m = 24, x0 = m, y0 = m, w = W - 2 * m, h = H - 2 * m;
  c.clearRect(0, 0, W, H);
  // outer glow (the blur is what makes the number readable from the far end of the bridge)
  c.save();
  c.shadowColor = pos ? '#4d95ff' : '#ff4048'; c.shadowBlur = 22;
  rrect(c, x0, y0, w, h, 20); c.fillStyle = pos ? '#1f55d6' : '#b3151d'; c.fill();
  c.restore();
  const g = c.createLinearGradient(0, y0, 0, y0 + h);
  if (pos) { g.addColorStop(0, '#6aa9ff'); g.addColorStop(1, '#1f55d6'); }
  else { g.addColorStop(0, '#ff6a6e'); g.addColorStop(1, '#b3151d'); }
  rrect(c, x0, y0, w, h, 20); c.globalAlpha = 0.94; c.fillStyle = g; c.fill();
  c.globalAlpha = 1;
  c.save(); rrect(c, x0, y0, w, h, 20); c.clip();
  c.fillStyle = 'rgba(255,255,255,.16)'; c.fillRect(x0, y0, w, h * 0.42);
  c.restore();
  rrect(c, x0, y0, w, h, 20); c.lineWidth = 7; c.strokeStyle = 'rgba(255,255,255,.95)'; c.stroke();
  const txt = e.kind === 'mul' ? '×' + e.val : (e.val > 0 ? '+' : '') + e.val;
  const prog = e.kind !== 'mul';
  c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineJoin = 'round';
  let fs = 120;
  c.font = fs + 'px Bungee, "Noto Sans TC", sans-serif';
  const tw = c.measureText(txt).width;
  if (tw > w - 40) { fs = Math.floor(fs * (w - 40) / tw); c.font = fs + 'px Bungee, "Noto Sans TC", sans-serif'; }
  const ty = y0 + h / 2 + (prog ? -6 : 4);
  c.lineWidth = 14; c.strokeStyle = 'rgba(10,14,22,.85)'; c.strokeText(txt, W / 2, ty);
  c.fillStyle = '#fff'; c.fillText(txt, W / 2, ty);
  if (prog) {
    // shots-to-next-point meter: every bullet that lands visibly moves it
    const bw = w - 70, bx0 = (W - bw) / 2, by = y0 + h - 22, f = clamp(e.hits / e.per, 0, 1);
    rrect(c, bx0, by, bw, 9, 4.5); c.fillStyle = 'rgba(10,14,22,.55)'; c.fill();
    if (f > 0.02) { rrect(c, bx0, by, Math.max(9, bw * f), 9, 4.5); c.fillStyle = '#fff'; c.fill(); }
  }
  if (e.fxFlash > 0) {
    rrect(c, x0, y0, w, h, 20); c.fillStyle = 'rgba(255,255,255,' + Math.min(0.6, e.fxFlash * 3) + ')'; c.fill();
  }
  if (e.p.baseMat) e.p.baseMat.color.setHex(pos ? 0x6aa0ff : 0xff5a5a);
  e.p.tex.needsUpdate = true;
}

function makeWeapon(z, x, tier) {

function makeHero(z, side, n) {
  const x = side * 2.05;
  const grp = new T.Group();

  const e = { type: 'hero', z, x, side, bz: z + 1.35, charge: 0, need: TUNE.battNeed + n * TUNE.battNeedPerStage, done: false, missed: false, grp, holo, batt, label, lastPct: -1 };
  e.draw = () => {

    c.font = '900 30px "Noto Sans TC", sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillStyle = '#fff'; c.fillText('射電池 ' + pct + '%', 128, 28);
    label.tex.needsUpdate = true;
    e.lastPct = pct;

// ---------------------------------------------------------------- spawning
const TINTS = [[1, 1, 1], [1.15, 0.95, 0.85], [0.85, 0.92, 1.06], [1.08, 1.06, 0.8], [0.82, 0.82, 0.84], [1.1, 0.85, 0.9]];
function spawnHorde(spec, z0) {
  // pool full: spawn what fits (the horde just gets thinner) instead of failing or overrunning the instance buffer
  const n = Math.min(spec.count, MAXZ - Z.length);
  for (let i = 0; i < n; i++) {
    const big = !!spec.big;
    Z.push({
      x: clamp(spec.cx + (Math.random() - 0.5) * spec.w, -ROAD + 0.35, ROAD - 0.35),
      z: z0 - Math.random() * spec.d,
      sp: big ? rr(0.7, 0.85) : rr(1, 1.7),
      hp: Math.floor(spec.hp) + (Math.random() < spec.hp % 1 ? 1 : 0), kind: spec.kind || '', s: big ? 1.65 : rr(0.92, 1.08), flash: 0, dying: 0, ph: Math.random() * 6.28, vx: 0,
      tint: big ? [1.25, 0.6, 0.55] : TINTS[(Math.random() * TINTS.length) | 0], big,
    });
  }
}

function syncSoldiers() {
  const want = Math.min(G.squad, MAXVIS);
  while (G.soldiers.length < want) {
    const m = new T.Object3D();   // transform carrier only; drawSoldiers() renders every soldier in one instanced draw call
    const s = { mesh: m, x: G.x + rr(-0.3, 0.3), z: G.z + 1.2, cd: Math.random() * 0.3 };
    m.position.set(s.x, 0, s.z);
    scene.add(m);
    G.soldiers.push(s);
    if (G.phase !== 'menu') burst(s.x, 1, s.z, 8, [0.3, 0.75, 1], 3, 0.5);
  }
  while (G.soldiers.length > want) scene.remove(G.soldiers.pop().mesh);
  G.dmgMul = G.squad > MAXVIS ? G.squad / MAXVIS : 1;
}
function perRow(n) { return n <= 2 ? Math.max(1, n) : Math.min(5, Math.ceil(Math.sqrt(n * 1.5))); }
function formationHalf() { return (perRow(G.soldiers.length) - 1) / 2 * SP; }

// src: horde kind of the zombie (or 'boss') that caused the death. Safe to call while iterating Z or G.soldiers as long as the
// caller stops iterating G.soldiers afterwards (the array is spliced / refilled by syncSoldiers).
function killSoldier(i, src) {
  if (G.safe || G.phase === 'over' || G.phase === 'win') return;
  const s = G.soldiers[i];
  if (!s) return;
  burst(s.x, 1, s.z, 14, [0.9, 0.2, 0.2], 3.5, 0.6);
  scene.remove(s.mesh);
  G.soldiers.splice(i, 1);
  bus.emit('soldierDied', { x: s.x, z: s.z });
  G.squad = Math.max(0, G.squad - 1);
  G.shake = Math.max(G.shake, 0.25);
  SFX.thud();
  syncSoldiers();
  if (G.squad <= 0) gameOver('屍潮把最後一名隊員也拖下去了。', src === 'boss' ? 'boss' : 'horde', src);
}

// ---------------------------------------------------------------- popups
const popLayer = $('#pops');
const pops = [];
const popPool = [];     // recycled DOM nodes, so a fight never allocates elements per hit
const POP_MAX = 14;
const pv = new T.Vector3();
let lastPlus = 0;
function pop(text, x, y, z, cls) {
  if (text === '+1') { const t = performance.now(); if (t - lastPlus < 160) return; lastPlus = t; }   // a volley can raise a gate many times a second
  if (pops.length >= POP_MAX) { const old = pops.shift(); old.el.remove(); popPool.push(old.el); }
  const el = popPool.pop() || document.createElement('div');
  el.className = 'pop ' + (cls || '');
  el.textContent = text;
  el.style.opacity = '0';
  popLayer.appendChild(el);
  pops.push({ el, x, y, z, t: 0 });
}
// Writes only transform/opacity (compositor properties) and reads cached viewport size: no layout reads per frame.
function updatePops(dt) {
  for (let i = pops.length - 1; i >= 0; i--) {
    const p = pops[i];
    p.t += dt; p.y += dt * 1.4;
    if (p.t > 1.1) { p.el.remove(); popPool.push(p.el); pops.splice(i, 1); continue; }
    pv.set(p.x, p.y, p.z).project(camera);
    const sx = (pv.x * 0.5 + 0.5) * vw, sy = (-pv.y * 0.5 + 0.5) * vh;
    const sc = p.t < 0.15 ? 0.6 + p.t / 0.15 * 0.6 : 1.2 - Math.min(0.2, (p.t - 0.15));
    p.el.style.transform = `translate(${sx.toFixed(1)}px, ${sy.toFixed(1)}px) translate(-50%, -50%) scale(${sc.toFixed(2)})`;
    p.el.style.opacity = Math.min(1, (1.1 - p.t) * 3).toFixed(2);
  }
}

// ---------------------------------------------------------------- sound
const SFX = {
  ctx: null, on: true, last: 0, noise: null, master: null,
  init() {
    if (this.ctx) { if (this.ctx.resume) this.ctx.resume(); return; }
    try {
      const C = window.AudioContext || window.webkitAudioContext;
      this.ctx = new C();
      const sr = this.ctx.sampleRate, buf = this.ctx.createBuffer(1, Math.floor(sr * 0.15), sr), d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      this.noise = buf;
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.55;
      this.master.connect(this.ctx.destination);
    } catch (e) { this.ctx = null; }
  },
  shot() {
    const c = this.ctx; if (!c || !this.on) return;
    const now = c.currentTime; if (now - this.last < 0.055) return; this.last = now;
    const s = c.createBufferSource(); s.buffer = this.noise;
    const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = rr(1200, 2000); f.Q.value = 0.9;
    const g = c.createGain(); g.gain.setValueAtTime(0.13, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
    s.connect(f); f.connect(g); g.connect(this.master); s.start(now); s.stop(now + 0.08);
  },
  tone(freq, dur, type, vol, slide, delay) {
    const c = this.ctx; if (!c || !this.on) return;
    const t0 = c.currentTime + (delay || 0);
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || 'square'; o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.linearRampToValueAtTime(Math.max(30, freq + slide), t0 + dur);
    g.gain.setValueAtTime(vol || 0.07, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(this.master); o.start(t0); o.stop(t0 + dur + 0.02);
  },
  gate(v) { this.tone(420 + clamp(v, -4, 12) * 45, 0.08, 'square', 0.05); },
  good() { [523, 659, 784].forEach((f, i) => this.tone(f, 0.14, 'triangle', 0.09, 0, i * 0.07)); },
  bad() { this.tone(220, 0.3, 'sawtooth', 0.08, -140); },
  hero() { [392, 523, 659, 784, 1046].forEach((f, i) => this.tone(f, 0.18, 'triangle', 0.09, 0, i * 0.06)); },
  thud() { this.tone(110, 0.18, 'sine', 0.16, -60); },
  boom() { this.tone(70, 0.5, 'sawtooth', 0.12, -40); },
};

// ---------------------------------------------------------------- combat
const BN = 56;
const buckets = Array.from({ length: BN }, () => []);
const bIdx = z => Math.floor(G.z + 10 - z);
function fillBuckets() {
  for (let k = 0; k < BN; k++) buckets[k].length = 0;
  for (let i = 0; i < Z.length; i++) {
    const k = bIdx(Z[i].z);
    if (k >= 0 && k < BN) buckets[k].push(i);
  }
}

function spawnBullet(x, z, dx, dz, dmg, kind, w) {
  if (nb >= MAXB) return;
  bw[nb] = w || 0;
  bx[nb] = x; bz[nb] = z; bdx[nb] = dx; bdz[nb] = dz; bl[nb] = kind ? 0.75 : 0.56; bd[nb] = dmg; bk[nb] = kind;
  bMesh.setColorAt(nb, kind ? tmpC.setRGB(1, 0.5, 0.15) : tmpC.setRGB(1, 0.88, 0.45));
  nb++;
}
function removeBullet(i) {
  const j = --nb;
  if (i === j) return;
  bw[i] = bw[j];
  bx[i] = bx[j]; bz[i] = bz[j]; bdx[i] = bdx[j]; bdz[i] = bdz[j]; bl[i] = bl[j]; bd[i] = bd[j]; bk[i] = bk[j];
  bMesh.setColorAt(i, bk[i] ? tmpC.setRGB(1, 0.5, 0.15) : tmpC.setRGB(1, 0.88, 0.45));
}

function hitZombie(zb, dmg) {
  if (zb.dying > 0) return;
  zb.hp -= dmg;
  zb.flash = 0.1;
  if (zb.hp <= 0) {
    zb.dying = 0.35;
    G.kills++;
    burst(zb.x, 1.1 * zb.s, zb.z, zb.big ? 22 : 7, [0.45, 1, 0.3], zb.big ? 4 : 2.6, 0.45);
    bus.emit('zombieDied', { x: zb.x, z: zb.z, big: zb.big });
  }
}
function splash(x, z, dmg) {
  burst(x, 1, z, 16, [1, 0.55, 0.15], 4.5, 0.4);
  const k0 = bIdx(z);
  for (let k = k0 - 2; k <= k0 + 2; k++) {
    if (k < 0 || k >= BN) continue;
    for (const zi of buckets[k]) {
      const zb = Z[zi];
      if ((zb.x - x) ** 2 + (zb.z - z) ** 2 < TUNE.splashR2) hitZombie(zb, dmg * TUNE.splashDmg);
    }
  }
}
function hitBoss(dmg) {
  const b = G.boss;
  b.hp -= dmg; b.flash = 0.08;
  bus.emit('bossHit');
  if (b.hp <= 0 && b.alive) {
    b.alive = false; b.deadT = 0;
    G.safe = true;
    G.kills++;
    burst(b.x, 3, b.z, 120, [0.45, 1, 0.3], 7, 0.9);
    burst(b.x, 3, b.z, 60, [1, 0.6, 0.2], 6, 0.7);
    G.shake = 0.8;
    SFX.boom();
    bus.emit('bossDied', { x: b.x, z: b.z });
  }
}
function gateHit(e, dmg) {
  burst(bxHit, 1.3, e.z + 0.1, 2, e.val > 0 || e.kind === 'mul' ? [0.4, 0.6, 1] : [1, 0.4, 0.4], 2, 0.25);
  bus.emit('gateHit', { e });
  if (e.kind === 'mul') return;
  e.hits += dmg;
  let changed = false;
  const per = (e.per + TUNE.gatePerSquad * Math.min(G.squad, MAXVIS)) * e.pf;
  while (e.hits >= per) { e.hits -= per; e.val++; changed = true; }
  if (changed) {
    e.draw(); e.bump = 1;
    SFX.gate(e.val);
    pop('+1', e.x + rr(-0.6, 0.6), 2.6, e.z, 'good');
  }
}
function heroHit(e, dmg) {
  burst(bxHit, 0.5, e.bz, 3, [0.4, 0.9, 1], 2.2, 0.3);
  e.charge += dmg;
  e.batt.position.y = 0.38 + 0.05;
  if (e.charge >= e.need) activateHero(e);
  else if (Math.floor(e.charge / e.need * 100) !== e.lastPct) e.draw();
}
let bxHit = 0;

function activateHero(e) {
  e.done = true;
  e.charge = e.need; e.draw();
  e.holo.visible = false;
  e.label.mesh.visible = false;
  const wp = e.grp.position;
  burst(wp.x, 1.8, wp.z, 70, [0.33, 0.86, 1], 5, 0.8);
  const mesh = new T.Mesh(MGEO, M.vc);
  mesh.scale.setScalar(0.72);
  mesh.position.set(wp.x, 0.52, wp.z);
  scene.add(mesh);
  if (G.mech) scene.remove(G.mech.mesh);
  G.mech = { mesh, x: wp.x, z: wp.z, cd: 0.4, side: e.side };
  G.shield = TUNE.shieldSecs;
  SFX.hero();
  bus.emit('heroActivated', { e });
  pop('機甲加入！', wp.x, 3.4, wp.z, 'holo');
}

const tgX = new Float32Array(6), tgZ = new Float32Array(6), tgS = new Float32Array(6);
let nT = 0;
function findTargets() {
  nT = 0;
  const b = G.boss;
  if (b && b.alive && G.z - b.z < 24) { tgX[0] = b.x; tgZ[0] = b.z; tgS[0] = 0; nT = 1; }
  // Zombies 0.3..16 ahead sit in buckets 10..26 (bIdx = floor(G.z + 10 - z)); pad by one on each side because the squad has
  // moved a little since the buckets were filled. Nearest first, so we can stop once nothing left can beat the worst pick.
  let worst = 0;
  for (let k = 9; k <= 27; k++) {
    if (nT === 6 && k - 11 >= tgS[worst]) break;
    const arr = buckets[k];
    for (let a = 0; a < arr.length; a++) {
      const zb = Z[arr[a]];
      if (zb.dying > 0) continue;
      const d = G.z - zb.z;
      if (d < 0.3 || d > 16) continue;
      const ax = Math.abs(zb.x - G.x);
      if (ax > d * 0.9 + 1.5) continue;
      const sc = d + ax * 0.6;
      if (nT < 6) {
        tgX[nT] = zb.x; tgZ[nT] = zb.z; tgS[nT] = sc; nT++;
        if (nT === 6) { worst = 0; for (let j = 1; j < 6; j++) if (tgS[j] > tgS[worst]) worst = j; }
        continue;
      }
      if (sc < tgS[worst]) {
        tgX[worst] = zb.x; tgZ[worst] = zb.z; tgS[worst] = sc;
        worst = 0; for (let j = 1; j < 6; j++) if (tgS[j] > tgS[worst]) worst = j;
      }
    }
  }
}

// ---------------------------------------------------------------- per-frame updates
function updateEvents(dt) {
  for (const e of G.events) {
    if (e.type === 'horde') {
      if (!e.spawned && e.z > G.z - TUNE.spawnAhead) { e.spawned = true; spawnHorde(e.spec, e.z); }
      continue;
    }
    if (e.type === 'gate') {
      if (e.bump > 0) { e.bump = Math.max(0, e.bump - dt * 5); }
      if (!e.used && G.z <= e.z) {
        e.used = true;
        let mate = null;
        if (e.pair !== undefined) for (const o of G.events) if (o !== e && o.pair === e.pair) { mate = o; o.used = true; o.fade = o.fade || 0.001; }
        e.fade = 0.001;
        const hit = pickGate(e, mate);
        if (hit) passGate(hit);
      }
      const sc = 1 + e.bump * 0.12 + e.fade * 0.5;
      e.grp.scale.set(sc, sc, sc);
      if (e.fade > 0) {
        e.fade += dt * 2.5;
        e.p.mesh.material.opacity = Math.max(0, 1 - e.fade);
        if (e.fade >= 1) e.grp.visible = false;
      }
      continue;
    }
    if (e.type === 'weapon') {
      if (e.taken) continue;
      e.gun.rotation.y += dt * 2;
      e.gun.position.y = 0.75 + Math.sin(G.time * 3 + e.z) * 0.1;
      e.ring.material.opacity = 0.55 + Math.sin(G.time * 5) * 0.25;
      if (Math.abs(G.z - e.z) < 0.9 && Math.abs(G.x - e.x) < 1.4 + formationHalf()) {
        e.taken = true; e.grp.visible = false;
        burst(e.x, 1, e.z, 30, [1, 0.7, 0.2], 3.5, 0.6);
        if (e.tier > G.weapon) {
          G.weapon = e.tier;
          pop(WEAPONS[e.tier].name + '！', e.x, 2.4, e.z, 'gold');
        } else {
          G.squad = Math.min(G.squad + 2, TUNE.maxSquad); syncSoldiers();
          pop('+2', e.x, 2.4, e.z, 'good');
        }
        SFX.good();
        bus.emit('weaponPickup', { e, w: e.w, lv: G.weaponLv, upgrade: false });
      } else if (G.z < e.z - 3) {
        e.taken = true; e.grp.visible = false;
      }
      continue;
    }
    if (e.type === 'hero') {
      if (!e.done && !e.missed) {
        e.holo.rotation.y = Math.sin(G.time * 0.8) * 0.5;
        M.holo.opacity = 0.24 + Math.sin(G.time * 6) * 0.06;
        e.batt.position.y += (0.38 - e.batt.position.y) * Math.min(1, dt * 12);
        if (G.z < e.z - 1.5) { e.missed = true; e.holo.visible = false; e.label.mesh.visible = false; }
      }
    }
  }
}

// Which side of the deck the squad is on when it crosses a gate line: by the mean x of the soldiers actually on the deck
// (not the drag target). Inside the +-0.05 dead zone around the centre line the side holding more soldiers wins; on an
// exact tie it returns 0 and pickGate hands out the worse gate, so parking on the line is never a free way to skip a penalty.
function squadSide() {
  const n = G.soldiers.length;
  let sx = 0, l = 0, r = 0;
  for (let i = 0; i < n; i++) { const x = G.soldiers[i].x; sx += x; if (x < -0.01) l++; else if (x > 0.01) r++; }
  const c = n ? sx / n : G.x;
  if (c > 0.05) return 1;
  if (c < -0.05) return -1;
  return r > l ? 1 : l > r ? -1 : 0;
}
function gateDelta(e) { return e.kind === 'mul' ? G.squad * (e.val - 1) : e.val; }
function pickGate(e, mate) {
  const side = squadSide();
  if (side !== 0) return e.side === side ? e : (mate && mate.side === side ? mate : null);
  if (!mate) return gateDelta(e) < 0 ? e : null;           // lone gate: only a penalty sticks
  return gateDelta(e) <= gateDelta(mate) ? e : mate;
}

function passGate(e) {
  const before = G.squad;
  if (e.kind === 'mul') G.squad = Math.round(G.squad * e.val);
  else G.squad += e.val;
  if (G.squad > TUNE.maxSquad) G.squad = TUNE.maxSquad;
  const diff = G.squad - before;
  const cz = G.z + 0.5;
  bus.emit('gatePass', { e, diff });
  if (diff > 0) { pop('+' + diff, G.x, 2.6, cz, 'good'); SFX.good(); }
  else if (diff < 0) { pop(String(diff), G.x, 2.6, cz, 'bad'); SFX.bad(); G.shake = 0.3; }
  if (G.squad <= 0) {
    G.squad = 0; syncSoldiers();
    gameOver('紅色數字門把整支小隊扣光了。下次先把它打成正數。', 'gate', '');
    return;
  }
  syncSoldiers();
}

function updateSquad(dt) {
  const half = formationHalf();
  G.tx = clamp(G.tx, -ROAD + 0.45 + half, ROAD - 0.45 - half);
  G.x += (G.tx - G.x) * Math.min(1, dt * 14);
  const n = G.soldiers.length, per = perRow(n);
  const W = WEAPONS[G.weapon];
  findTargets();
  const bossOn = !!(G.boss && G.boss.alive && G.z - G.boss.z < 24);
  const running = G.phase === 'run';
  for (let i = 0; i < n; i++) {
    const s = G.soldiers[i];
    const row = Math.floor(i / per), inRow = Math.min(per, n - row * per), col = i % per;
    const tx = G.x + (col - (inRow - 1) / 2) * SP, tz = G.z + row * SP;
    s.x += (tx - s.x) * Math.min(1, dt * 10);
    s.z += (tz - s.z) * Math.min(1, dt * 10);
    let dx = 0, dz = -1;
    if (nT > 0) {
      // with the boss in range, a fixed share of the squad (spread evenly by a golden-ratio stride) keeps firing at it
      const k = bossOn && nT > 1 ? ((i * 0.618034) % 1 < TUNE.bossFocus ? 0 : 1 + i % (nT - 1)) : i % nT;
      dx = tgX[k] - s.x; dz = tgZ[k] - s.z;
      const l = Math.hypot(dx, dz) || 1; dx /= l; dz /= l;
      if (dz > -0.2) { dx = 0; dz = -1; }
    }
    s.mesh.position.set(s.x, running ? Math.abs(Math.sin(G.time * 11 + i)) * 0.08 : 0, s.z);
    s.mesh.rotation.y = Math.atan2(-dx, -dz);
    s.cd -= dt;
    if (s.cd <= 0) {
      s.cd = Math.max(s.cd, -0.05) + 1 / W.rate * rr(0.85, 1.15);
      for (let p = 0; p < W.pellets; p++) {
        const a = (Math.random() - 0.5) * W.spread * 2 + (W.pellets > 1 ? (p - (W.pellets - 1) / 2) * W.spread * 0.7 : 0);
        const ca = Math.cos(a), sa = Math.sin(a);
        const rx = dx * ca - dz * sa, rz = dx * sa + dz * ca;
        spawnBullet(s.x + rx * 0.5 + 0.14, s.z + rz * 0.5, rx, rz, W.dmg * G.dmgMul, 0, G.weapon);
      }
      SFX.shot();
      bus.emit('shot', { x: s.x, z: s.z, w: G.weapon, lv: G.weaponLv });
    }
  }
  // shield bubble
  if (G.shield > 0) {
    G.shield -= dt;
    shieldMesh.visible = true;
    const rows = Math.ceil(n / per);
    shieldMesh.position.set(G.x, 0.9, G.z + (rows - 1) * SP / 2);
    const r = Math.max(half, (rows - 1) * SP / 2) + 1.1;
    shieldMesh.scale.setScalar(r * (1 + Math.sin(G.time * 10) * 0.02));
    M.shield.opacity = G.shield < 1 ? 0.16 * (Math.sin(G.time * 30) > 0 ? 1 : 0.3) : 0.16;
  } else shieldMesh.visible = false;
}
const shieldMesh = new T.Mesh(new T.SphereGeometry(1, 28, 18), M.shield);
shieldMesh.visible = false;
scene.add(shieldMesh);

function updateMech(dt) {
  const m = G.mech;
  if (!m) return;
  const half = formationHalf();
  let side = m.side || 1;
  let tx = G.x + side * (half + 1.3);
  if (Math.abs(tx) > ROAD - 0.6) { side = -side; tx = G.x + side * (half + 1.3); }
  tx = clamp(tx, -ROAD + 0.6, ROAD - 0.6);
  m.side = side;
  m.x += (tx - m.x) * Math.min(1, dt * 4);
  m.z += (G.z + 0.6 - m.z) * Math.min(1, dt * 4);
  const stomp = G.phase === 'run' ? Math.abs(Math.sin(G.time * 6)) * 0.12 : 0;
  m.mesh.position.set(m.x, stomp, m.z);
  m.cd -= dt;
  let dx = 0, dz = -1;
  if (nT > 0) { dx = tgX[0] - m.x; dz = tgZ[0] - m.z; const l = Math.hypot(dx, dz) || 1; dx /= l; dz /= l; if (dz > -0.2) { dx = 0; dz = -1; } }
  m.mesh.rotation.y = Math.atan2(-dx, -dz);
  if (m.cd <= 0) {
    m.cd = TUNE.mechCd;
    const dmg = TUNE.mechDmg + G.level * TUNE.mechDmgPerStage;
    spawnBullet(m.x - 0.7, m.z - 0.8, dx, dz, dmg, 1);
    spawnBullet(m.x + 0.7, m.z - 0.8, dx, dz, dmg, 1);
    burst(m.x, 1.6, m.z - 1, 6, [1, 0.6, 0.2], 2, 0.2);
  }
}

let sepTick = 0;
function updateZombies(dt) {
  const moving = G.phase === 'run' || G.phase === 'boss';
  const half = formationHalf();
  for (let i = Z.length - 1; i >= 0; i--) {
    const zb = Z[i];
    if (zb.dying > 0) {
      zb.dying -= dt;
      if (zb.dying <= 0) { Z[i] = Z[Z.length - 1]; Z.pop(); }
      continue;
    }
    if (zb.flash > 0) zb.flash -= dt;
    if (!moving) continue;
    zb.z += zb.sp * dt;
    const d = G.z - zb.z;
    if (d < 8 && d > -1.5) {
      const target = G.x + clamp(zb.x - G.x, -half, half);
      zb.vx = clamp((target - zb.x) * 1.4, -1.6, 1.6);
    } else zb.vx = Math.sin(G.time * 1.3 + zb.ph) * 0.2;
    zb.x = clamp(zb.x + zb.vx * dt, -ROAD + 0.3, ROAD - 0.3);
    if (zb.z > G.z + 7) { Z[i] = Z[Z.length - 1]; Z.pop(); }
  }
  // buckets + light separation so the horde spreads instead of stacking
  fillBuckets();
  if (moving) {
    // every bucket is relaxed every other step with twice the push (same result, half the pair tests)
    sepTick ^= 1;
    for (let k = sepTick; k < BN; k += 2) {
      const arr = buckets[k];
      for (let a = 0; a < arr.length; a++) {
        const A = Z[arr[a]];
        if (A.dying > 0) continue;
        for (let b = a + 1; b < arr.length; b++) {
          const B = Z[arr[b]];
          if (B.dying > 0) continue;
          const dx = B.x - A.x, r = 0.21 * (A.s + B.s);
          if (Math.abs(dx) < r && Math.abs(B.z - A.z) < r) {
            const push = (r - Math.abs(dx)) * 0.5 * (dx >= 0 ? 1 : -1);
            A.x = clamp(A.x - push, -ROAD + 0.3, ROAD - 0.3);
            B.x = clamp(B.x + push, -ROAD + 0.3, ROAD - 0.3);
          }
        }
      }
    }
    // contact with the squad / mech: only the buckets around the squad (z within -0.7 .. +rows*SP+0.5 of G.z, mech at G.z+0.6)
    const rows = Math.ceil(G.soldiers.length / Math.max(1, perRow(G.soldiers.length)));
    const zmin = G.z - 0.7, zmax = G.z + rows * SP + 0.5;
    const m = G.mech;
    const kLo = Math.max(0, Math.floor(G.z + 10 - zmax) - 1), kHi = Math.min(BN - 1, Math.floor(G.z + 10 - zmin) + 1);
    for (let k = kLo; k <= kHi && G.phase !== 'over'; k++) {
      const arr = buckets[k];
      for (let a = 0; a < arr.length && G.phase !== 'over'; a++) {
        const zb = Z[arr[a]];
        if (zb.dying > 0) continue;
        if (m && Math.abs(zb.x - m.x) < 0.9 && Math.abs(zb.z - m.z) < 0.8) { hitZombie(zb, 999); continue; }
        if (zb.z < zmin || zb.z > zmax) continue;
        const r = 0.38 * zb.s + 0.12;
        for (let s = 0; s < G.soldiers.length; s++) {
          const so = G.soldiers[s];
          if (Math.abs(so.x - zb.x) < r && Math.abs(so.z - zb.z) < r) {
            hitZombie(zb, 999);
            bus.emit('soldierContact', { x: so.x, z: so.z, shielded: G.shield > 0 || G.safe });
            if (G.shield <= 0) killSoldier(s, zb.kind);   // killSoldier splices G.soldiers: we leave the soldier loop right away
            break;
          }
        }
      }
    }
  }
}

const activeE = [];   // gates / batteries a bullet can hit this step (reused, no per-step allocation)
function updateBullets(dt) {
  let na = 0;
  for (let i = 0; i < G.events.length; i++) {
    const e = G.events[i];
    if ((e.type === 'gate' && !e.used) || (e.type === 'hero' && !e.done && !e.missed)) {
      if (e.z < G.z + 2 && e.z > G.z - 30) activeE[na++] = e;
    }
  }
  const b = G.boss;
  for (let i = 0; i < nb; i++) {
    let hit = false;
    for (let step = 0; step < 2 && !hit; step++) {
      const oz = bz[i];
      bx[i] += bdx[i] * BULLET_SPEED * dt * 0.5;
      bz[i] += bdz[i] * BULLET_SPEED * dt * 0.5;
      const x = bx[i], z = bz[i], dmg = bd[i], kind = bk[i];
      if (b && b.alive && Math.abs(x - b.x) < 1.25 && Math.abs(z - b.z) < 0.9) {
        hitBoss(dmg); burst(x, 2.4, z, 2, [0.45, 1, 0.3], 2, 0.25);
        if (kind) splash(x, z, dmg);
        hit = true; break;
      }
      const k0 = bIdx(z);
      for (let k = k0 - 1; k <= k0 + 1 && !hit; k++) {
        if (k < 0 || k >= BN) continue;
        const arr = buckets[k];
        for (let a = 0; a < arr.length; a++) {
          const zb = Z[arr[a]];
          if (zb.dying > 0) continue;
          const r = 0.32 * zb.s;
          if (Math.abs(zb.x - x) < r + 0.06 && Math.abs(zb.z - z) < r + 0.25) {
            hitZombie(zb, dmg);
            if (kind) splash(x, z, dmg);
            else burst(x, 1.2, z, 1, [0.6, 1, 0.35], 1.5, 0.2);
            hit = true; break;
          }
        }
      }
      if (hit) break;
      for (let q = 0; q < na; q++) {
        const e = activeE[q];
        if (e.type === 'gate') {
          if (!e.used && oz > e.z && z <= e.z && Math.abs(x - e.x) < 1.85) { bxHit = x; gateHit(e, dmg); hit = true; break; }
        } else if (!e.done && oz > e.bz && z <= e.bz && Math.abs(x - e.x) < 0.95) {
          bxHit = x; heroHit(e, dmg); hit = true; break;
        }
      }
    }
    bl[i] -= dt;
    if (hit || bl[i] <= 0 || Math.abs(bx[i]) > ROAD + 1) { removeBullet(i); i--; }
  }
}

// ---------------------------------------------------------------- boss
const bossMat = new T.MeshLambertMaterial({ vertexColors: true, emissive: 0x000000 });
const bossMesh = new T.Mesh(ZGEO, bossMat);
bossMesh.scale.setScalar(3.2);
bossMesh.visible = false;
scene.add(bossMesh);

function startBoss() {
  G.phase = 'boss';
  const W = WEAPONS[G.weapon];
  const dps = G.squad * W.rate * W.pellets * W.dmg * W.bossEff + (G.mech ? 2 * (TUNE.mechDmg + G.level * TUNE.mechDmgPerStage) / TUNE.mechCd : 0);
  const hp = Math.round(TUNE.bossHp * G.level + dps * TUNE.bossDpsSecs);
  G.boss = { x: 0, z: G.z - 30, hp, max: hp, sp: TUNE.bossSpeed + G.level * TUNE.bossSpeedPerStage, flash: 0, alive: true, deadT: 0, spawnT: 2.5, hitT: 0 };
  bossMesh.visible = true;
  bossMesh.rotation.set(0, 0, 0);
  $('#bossbar').hidden = false;
  pop('巨屍來了！', 0, 3, G.z - 8, 'bad');
  bus.emit('bossSpawn');
  SFX.boom();
}
function updateBoss(dt) {
  const b = G.boss;
  if (!b) return;
  if (b.alive) {
    b.z += b.sp * dt;
    b.x += clamp(G.x - b.x, -1, 1) * dt * 0.7;
    b.x = clamp(b.x, -ROAD + 1, ROAD - 1);
    b.flash -= dt;
    b.hitT -= dt;
    bossMat.emissive.setRGB(b.flash > 0 ? 0.15 : 0, b.flash > 0 ? 0.6 : 0, b.flash > 0 ? 0.1 : 0);
    bossMesh.position.set(b.x, Math.abs(Math.sin(G.time * 3)) * 0.15, b.z);
    bossMesh.rotation.z = Math.sin(G.time * 3) * 0.06;
    b.spawnT -= dt;
    if (b.spawnT <= 0) {
      b.spawnT = TUNE.bossMinionEvery;
      spawnHorde({ kind: 'minion', cx: 0, w: 7.4, d: 3, count: TUNE.bossMinions + G.level * TUNE.bossMinionsPerStage, hp: 1 + (G.level - 1) * TUNE.hpPerStage }, b.z - 2);
    }
    if (b.z > G.z - 1.6 && b.hitT <= 0) {
      b.hitT = 0.6;
      if (G.shield <= 0) {
        for (let k = 0; k < 2 && G.soldiers.length && G.phase === 'boss'; k++) killSoldier(0, 'boss');
      }
      b.z -= 4.5;
      G.shake = 0.6;
      SFX.boom();
    }
  } else {
    b.deadT += dt;
    const k = Math.min(1, b.deadT / 0.8);
    bossMesh.rotation.x = -k * 1.45;
    bossMesh.position.y = -k * 1.2;
    bossMat.emissive.setRGB(0, 0, 0);
    if (b.deadT > 1.6 && G.phase === 'boss') win();
  }
  $('#bossFill').style.width = Math.max(0, b.hp / b.max * 100) + '%';
}

// ---------------------------------------------------------------- rendering
const zWalkArr = zWalk.array;
function drawZombies(t) {
  const moving = G.phase === 'run' || G.phase === 'boss';
  for (let i = 0; i < Z.length; i++) {
    const zb = Z[i];
    // gait phase: legs are tagged in the vertex shader; body bob/roll below use the same angle so steps and bounce line up
    const spd = clamp(zb.sp / 1.35, 0.55, 1.3), th0 = zb.ph * 0.5 - 0.785;
    const th = t * 4 * spd + th0;
    let y = 0, rx = 0, sq = 1;
    if (zb.dying > 0) { const k = 1 - zb.dying / 0.35; rx = -k * 1.35; y = -k * 0.45; sq = 1 - k * 0.2; }
    else y = Math.abs(Math.cos(th)) * 0.07;
    dummy.position.set(zb.x, y, zb.z);
    dummy.rotation.set(rx, Math.atan2(zb.vx, zb.sp) * 0.8, Math.sin(th) * 0.07);
    dummy.scale.set(zb.s, zb.s * sq, zb.s);
    dummy.updateMatrix();

const FLASH_MAX = 48;

function flashAt(x, y, z, life, r, g, b) {

function updateFlashes(dt) {

// ---- shockwave rings (pool of 6; hidden meshes cost no draw call)
const RING_GEO = new T.RingGeometry(0.86, 1, 44).rotateX(-Math.PI / 2);
const rings = [];
for (let i = 0; i < 6; i++) {
  const mat = new T.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0, blending: T.AdditiveBlending, depthWrite: false, side: T.DoubleSide, fog: false });
  const mesh = new T.Mesh(RING_GEO, mat);

}

  k.on = true; k.t = 0; k.dur = dur; k.r = r;

  fHead = 0; fLive = 0; fLife.fill(0); fCol.fill(0);
  for (let i = 0; i < FLASH_MAX; i++) fPos[i * 3 + 1] = -50;
  fGeo.attributes.position.needsUpdate = true; fGeo.attributes.color.needsUpdate = true;
  splatN = 0; splatHead = 0; splatLive = 0; splatMesh.count = 0; splatAge.fill(99);
  for (const k of rings) { k.on = false; k.mesh.visible = false; }
  FX.shake = 0; sqPrev = null; progQ = -1; ghostW = 1; ghostQ = -1;
  for (const t of TIPS) if (t.on) showTip(t, false);
}
function fxUpdate(dt) {
  if (G.time < fxLastTime - 0.01) fxReset();
  fxLastTime = G.time;
  CLOCK.uTime.value = G.time;
  updateFlashes(dt);
  updateSplats(dt);
  updateRings(dt);
  updateGateFx(dt);
  updateHolo(G.time);
  updateBossBar(dt);
}

// ---- adaptive resolution: start at min(dpr, 2); step 2 -> 1.5 -> 1 when frames stay slow, then trim particle counts
const Perf = { acc: 0, n: 0, prev: 0, avg: 0 };
function perfTick() {
  const now = nowMs(), d = now - Perf.prev; Perf.prev = now;
  if (G.paused || (G.phase !== 'run' && G.phase !== 'boss') || d > 250 || d <= 0) { Perf.acc = 0; Perf.n = 0; return; }
  Perf.acc += d; Perf.n++;
  if (Perf.acc < 2000) return;
  Perf.avg = Perf.acc / Perf.n; Perf.acc = 0; Perf.n = 0;
  if (Perf.avg > 20) {
    if (prIdx < PR_STEPS.length - 1) { prIdx++; resize(); }
    else fxScale = Math.max(0.4, fxScale * 0.7);
  }
}

const pauseBtn = $('#pause');
let pauseShown = true;
function render(dt) {
  const rdt = G.paused ? 0 : dt;
  const playing = G.phase === 'run' || G.phase === 'boss';
  if (playing) updateHud();
  if (playing !== pauseShown) { pauseShown = playing; pauseBtn.hidden = !playing; }
  fxUpdate(rdt);
  drawZombies(G.time);
  drawSoldiers();
  drawBullets();
  drawShadows();
  drawParticles(rdt);
  G.shake = Math.max(0, G.shake - rdt * 1.5);
  FX.shake = Math.max(0, FX.shake - rdt * 1.5);
  const sh = reduced || G.paused ? 0 : Math.max(G.shake, FX.shake);
  const sway = G.phase === 'menu' ? Math.sin(G.time * 0.4) * 0.6 : 0;
  const cx = G.x * 0.35 + sway;
  camera.position.set(cx + (Math.random() - 0.5) * sh, 12 + (Math.random() - 0.5) * sh, G.z + 10);
  camera.lookAt(cx * 0.6, 0, G.z - 4);
  camera.updateMatrixWorld();   // so popups/hints project with this frame's camera, not last frame's
  updatePops(rdt);
  updateTips();
  renderer.render(scene, camera);
  perfTick();
}

// ---------------------------------------------------------------- flow
const hintEl = $('#hint');
function resetWorld() {
  Z.length = 0; nb = 0; np = 0; nT = 0;
  for (let k = 0; k < BN; k++) buckets[k].length = 0;
  for (const s of G.soldiers) scene.remove(s.mesh);
  G.soldiers = [];
  if (G.mech) { scene.remove(G.mech.mesh); G.mech = null; }
  G.boss = null; bossMesh.visible = false; $('#bossbar').hidden = true;
  shieldMesh.visible = false;
  for (const p of pops) p.el.remove();
  pops.length = 0;
  acc = 0;
  Object.assign(G, { x: 0, tx: 0, z: 0, squad: TUNE.startSquad, weapon: 0, kills: 0, shield: 0, shake: 0, time: 0, safe: false, dmgMul: 1 });
}
function prepare(level) {
  G.level = level;
  G.phase = 'menu';
  resetWorld();
  buildLevel(level);
  syncSoldiers();
  updateEvents(0);
  fillBuckets();
  for (const id of ['menuLevel', 'overLevel']) $('#' + id).textContent = 'STAGE ' + level;
  $('#bestLine').textContent = best > 1 ? '最佳紀錄：第 ' + best + ' 關' : '';
}
function startRun() {
  SFX.init();
  if (G.phase !== 'menu') prepare(G.level);
  for (const id of ['menu', 'over', 'win']) $('#' + id).hidden = true;
  $('#hud').hidden = false;
  hintEl.style.opacity = '1';
  setTimeout(() => { hintEl.style.opacity = '0'; }, 3500);
  G.phase = 'run';
}
function gameOver(reason, cause, kind) {
  if (G.phase !== 'run' && G.phase !== 'boss') return;   // only the first death of a run counts (never twice, never after a win)
  const was = G.phase;
  G.phase = 'over';
  nb = 0;
  SFX.bad();
  bus.emit('gameOver', { reason, cause: cause || 'horde', kind: kind || '', phase: was });
  $('#overReason').textContent = reason;
  $('#overKills').textContent = String(G.kills);
  $('#overDist').textContent = Math.round(clamp(-G.z / G.L, 0, 1) * 100) + '%';
  setTimeout(() => { if (G.phase === 'over') $('#over').hidden = false; }, 700);
}
function win() {
  if (G.phase !== 'boss') return;
  G.phase = 'win';
  nb = 0;
  bus.emit('win');
  SFX.hero();
  best = Math.max(best, G.level + 1);
  try { localStorage.setItem('zombie-bridge-best', String(best)); } catch (e) {}
  $('#winLevel').textContent = 'STAGE ' + G.level + ' CLEAR';
  $('#winKills').textContent = String(G.kills);
  $('#winSquad').textContent = String(G.squad);
  $('#win').hidden = false;
}

// ---------------------------------------------------------------- UI wiring (pause, stage select, mute)
G.paused = false;
const pauseOv = $('#pauseOv');
function setPaused(p) {
  p = !!p;
  if (p === G.paused) return;
  if (p && !(G.phase === 'run' || G.phase === 'boss')) return;
  G.paused = p;
  pauseOv.hidden = !p;
  keys.l = keys.r = false; drag = null;
  if (SFX.ctx) { try { if (p) SFX.ctx.suspend(); else SFX.ctx.resume(); } catch (e) {} }
  if (p) { try { $('#btnResume').focus({ preventScroll: true }); } catch (e) {} }
}
function goMenu() {
  setPaused(false);
  pauseOv.hidden = true;
  prepare(G.level);
  $('#hud').hidden = true;
  for (const id of ['over', 'win']) $('#' + id).hidden = true;
  $('#menu').hidden = false;
  syncMenu();
}
function syncMenu() {
  const multi = best > 1;
  const prev = $('#stagePrev'), next = $('#stageNext');
  prev.hidden = next.hidden = !multi;
  prev.style.visibility = G.level > 1 ? 'visible' : 'hidden';
  next.style.visibility = G.level < best ? 'visible' : 'hidden';
}
function pickStage(n) {
  if (G.phase !== 'menu') return;
  n = clamp(n, 1, best);
  if (n !== G.level) prepare(n);
  syncMenu();
}
$('#stagePrev').addEventListener('click', () => pickStage(G.level - 1));
$('#stageNext').addEventListener('click', () => pickStage(G.level + 1));
$('#btnStart').addEventListener('click', startRun);
$('#btnRetry').addEventListener('click', () => { prepare(G.level); startRun(); });
$('#btnNext').addEventListener('click', () => { prepare(G.level + 1); startRun(); });
$('#btnMenu1').addEventListener('click', goMenu);
$('#btnMenu2').addEventListener('click', () => { goMenu(); });
$('#btnMenu3').addEventListener('click', goMenu);
$('#pause').addEventListener('click', () => setPaused(true));
$('#btnResume').addEventListener('click', () => setPaused(false));
$('#btnRestart').addEventListener('click', () => { setPaused(false); pauseOv.hidden = true; prepare(G.level); startRun(); });
window.addEventListener('keydown', e => {
  if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') setPaused(!G.paused);
});
document.addEventListener('visibilitychange', () => { if (document.hidden) setPaused(true); });

const MUTE_KEY = 'zombie-bridge-mute';
function syncMute() {
  $('#mute').textContent = SFX.on ? '音' : '靜';
  $('#mute').setAttribute('aria-pressed', String(!SFX.on));
}
try { if (localStorage.getItem(MUTE_KEY) === '1') SFX.on = false; } catch (e) {}
syncMute();
$('#mute').addEventListener('click', () => {
  SFX.on = !SFX.on;
  syncMute();
  try { localStorage.setItem(MUTE_KEY, SFX.on ? '0' : '1'); } catch (e) {}
});

// ---------------------------------------------------------------- input
let drag = null;
const keys = { l: false, r: false };
window.addEventListener('pointerdown', e => {
  if (G.paused || (e.target.closest && e.target.closest('button'))) return;
  drag = { x: e.clientX, tx: G.tx };
});
window.addEventListener('pointermove', e => {
  if (!drag) return;
  const k = (ROAD * 2.2) / Math.min(window.innerWidth, 640);
  const raw = drag.tx + (e.clientX - drag.x) * k;
  const half = formationHalf();
  const lim = ROAD - 0.45 - half;
  G.tx = clamp(raw, -lim, lim);
  if (G.tx !== raw) { drag.tx = G.tx; drag.x = e.clientX; }
});
for (const ev of ['pointerup', 'pointercancel']) window.addEventListener(ev, () => { drag = null; });
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.l = true;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.r = true;
});
window.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.l = false;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.r = false;
});

// ---------------------------------------------------------------- loop
let last = performance.now();
// Simulation only: no DOM writes besides HUD text, no rendering. Safe to call many times per frame (fast-forward tests).
function step(dt) {
  const playing = G.phase === 'run' || G.phase === 'boss';
  G.time += dt;
  if (playing) {
    if (keys.l) G.tx -= dt * 9;
    if (keys.r) G.tx += dt * 9;
    if (G.phase === 'run') {
      G.z -= TUNE.run * dt;
      if (G.z <= -G.L) { G.z = -G.L; startBoss(); }
    }
    updateEvents(dt);
    updateSquad(dt);
    updateMech(dt);
    updateZombies(dt);
    if (G.phase === 'over') return;       // the last soldier fell during this step: nothing else may act on it
    updateBullets(dt);
    updateBoss(dt);
  } else {
    updateEvents(0);
    updateZombies(dt);
    if (G.boss && !G.boss.alive) updateBoss(dt);
  }
}

// Fixed-timestep loop: the simulation always advances in STEP (1/60 s) slices, so game speed does not depend on the display
// refresh rate or on how fast the device renders. At most MAX_STEPS slices are run per frame; if a frame takes longer than that
// the surplus is dropped (the game slows down rather than freezing in a catch-up spiral).
let acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (document.hidden) { last = now; acc = 0; return; }       // paused: nothing runs, and no time jump on return
  let dt = (now - last) / 1000;
  last = now;
  if (!(dt > 0)) dt = 0;
  if (dt > 0.25) dt = 0.25;                                    // tab was throttled / debugger pause: treat as one long frame
  acc += dt;
  let n = 0;
  if (G.paused) acc = 0;                                       // pause menu: render only, simulation frozen
  while (acc >= STEP && n < MAX_STEPS) { step(STEP); acc -= STEP; n++; }
  if (acc > STEP) acc = STEP;                                  // could not keep up: drop the backlog
  render(Math.min(dt, 0.05));
}
document.addEventListener('visibilitychange', () => { last = performance.now(); acc = 0; });

prepare(G.level);
syncMenu();
if (document.fonts && document.fonts.load) {
  Promise.all([document.fonts.load('96px Bungee'), document.fonts.load('900 40px "Noto Sans TC"')])
    .then(() => { for (const e of G.events) if (e.draw) e.draw(); })
    .catch(() => {});
}
requestAnimationFrame(frame);

// handle for automated play-tests
window.__zb = { renderer, G, Z, TUNE, WEAPONS, pickGate, squadSide, pops, start: startRun, prepare, step, render, syncSoldiers, formationHalf, spawnHorde, activateHero, spawnBullet, setPaused, bus,
  stats: () => ({ bullets: nb, particles: np, buckets: buckets.reduce((a, b) => a + b.length, 0) }),
  perf: () => ({ pr: PR_STEPS[prIdx], steps: PR_STEPS, avg: Perf.avg, fxScale }) };
})();
</script>
</body>
</html>
